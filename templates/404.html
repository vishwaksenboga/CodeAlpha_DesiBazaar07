{% extends 'base.html' %}
{% block title %}404 — Page Not Found — DesiBazaar{% endblock %}
{% block content %}
<div class="container py-5 text-center" style="min-height:70vh;display:flex;align-items:center;justify-content:center;">
  <div>
    <div style="font-size:7rem;line-height:1;animation:float 3s ease-in-out infinite;color:var(--primary);"><i class="bi bi-compass"></i></div>
    <h1 style="font-size:6rem;font-weight:900;color:var(--primary);line-height:1;margin:1rem 0;">404</h1>
    <h2 class="fw-bold mb-3">Oops! Page Not Found</h2>
    <p class="text-muted mb-4" style="max-width:400px;margin:0 auto 2rem;">The page you're looking for seems to have gone on a chai break. Let's get you back on track!</p>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="{% url 'home' %}" class="btn-primary-custom"><i class="bi bi-house-door me-2"></i>Go Home</a>
      <a href="{% url 'product_list' %}" class="btn-outline-custom"><i class="bi bi-bag me-2"></i>Browse Products</a>
    </div>
  </div>
</div>
<style>
@keyframes float {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
}
</style>
{% endblock %}
